      - ASPNETCORE_URLS=${PAYMENT_URLS}
      - ASPNETCORE_HTTP_PORT=${PAYMENT_HTTP_PORT}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_PATHS=kv/nova-core/dev/infra-kafka,kv/nova-core/dev/infra-redis,kv/nova-core/dev/security,kv/nova-core/dev/services/payment
    healthcheck:
