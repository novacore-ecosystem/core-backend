services:
  # ============= API GATEWAY =============
  yarp-api-gateway:
    container_name: ${GATEWAY_CONTAINER_NAME}
    ports:
      - "${GATEWAY_PUBLIC_PORT}:${GATEWAY_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_PATHS=kv/nova-core/dev/security,kv/nova-core/dev/infra-redis,kv/nova-core/dev/services/gateway
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${GATEWAY_HTTP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============= MICROSERVICES =============
  auth-api:
    container_name: ${AUTH_CONTAINER_NAME}
    ports:
      - "${AUTH_PUBLIC_HTTP_PORT}:${AUTH_HTTP_PORT}"
      - "${AUTH_GRPC_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${AUTH_URLS}
      - ASPNETCORE_HTTP_PORT=${AUTH_HTTP_PORT}
      - ASPNETCORE_GRPC_PORT=${AUTH_GRPC_PORT}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_PATHS=kv/nova-core/dev/infra-kafka,kv/nova-core/dev/infra-redis,kv/nova-core/dev/security,kv/nova-core/dev/services/auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-api:
