  promotion-api:
    container_name: ${PROMOTION_CONTAINER_NAME}
    ports:
      - "${PROMOTION_PUBLIC_HTTP_PORT}:${PROMOTION_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${PROMOTION_URLS}
      - ASPNETCORE_HTTP_PORT=${PROMOTION_HTTP_PORT}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_PATHS=kv/nova-core/dev/infra-kafka,kv/nova-core/dev/infra-redis,kv/nova-core/dev/infra-elastic,kv/nova-core/dev/security,kv/nova-core/dev/services/promotion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
