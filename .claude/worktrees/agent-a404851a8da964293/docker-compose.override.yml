services:
  # ============= API GATEWAY =============
  yarp-api-gateway:
    container_name: ${GATEWAY_CONTAINER_NAME}
    ports:
      - "${GATEWAY_PUBLIC_PORT}:${GATEWAY_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      # Service URLs
      - Auth__Url=${AUTH_SERVICE_URL}
      - Inventory__Url=${INVENTORY_SERVICE_URL}
      - Order__Url=${ORDER_SERVICE_URL}
      - Product__Url=${PRODUCT_SERVICE_URL}
      - User__Url=${USER_SERVICE_URL}
      # JWT Configuration
      - Gateway__Jwt__SecretKey=${GATEWAY_JWT_SECRET_KEY}
      - Gateway__Jwt__Issuer=${GATEWAY_JWT_ISSUER}
      - Gateway__Jwt__Audience=${GATEWAY_JWT_AUDIENCE}
      # Redis (refresh token existence check only)
      - Gateway__Redis__ConnectionString=${GATEWAY_REDIS_CONNECTION_STRING}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      - Logging__Elasticsearch__Url=${ELASTICSEARCH_URL}
      # Observability (APM/tracing - see docs/setup/observability.md)
      - Observability__ApmServerUrl=${APM_SERVER_URL}
    healthcheck:
      # Must probe the in-container port (GATEWAY_HTTP_PORT/8080), not GATEWAY_PUBLIC_PORT (5000)
      # - that's only the host-side mapping, and curl runs *inside* this container.
      test:
        ["CMD", "curl", "-f", "http://localhost:${GATEWAY_HTTP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============= MICROSERVICES =============
  auth-api:
    container_name: ${AUTH_CONTAINER_NAME}
    ports:
      - "${AUTH_PUBLIC_HTTP_PORT}:${AUTH_HTTP_PORT}"
      - "${AUTH_GRPC_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${AUTH_URLS}
      - ASPNETCORE_HTTP_PORT=${AUTH_HTTP_PORT}
      - ASPNETCORE_GRPC_PORT=${AUTH_GRPC_PORT}
      # Database
      - ConnectionStrings__DefaultConnection=${AUTH_DB_CONNECTION}
      - ConnectionStrings__Hangfire=${HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      - Logging__Elasticsearch__Url=${ELASTICSEARCH_URL}
      # Observability (APM/tracing - see docs/setup/observability.md)
      - Observability__ApmServerUrl=${APM_SERVER_URL}
      # Cache (Redis)
      - Cache__ConnectionString=${AUTH_REDIS_CONNECTION_STRING}
      - Cache__DefaultExpirationMinutes=${AUTH_REDIS_EXPIRATION_MINUTES}
      - Cache__KeyPrefix=${AUTH_REDIS_KEY_PREFIX}
      - Cache__ConnectionTimeout=${AUTH_REDIS_CONNECTION_TIMEOUT}
      # JWT
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Hangfire
      - Jobs__RefreshTokenSync__JobId=${AUTH_HANGFIRE_JOB_ID}
      - Jobs__RefreshTokenSync__CronExpression=${AUTH_HANGFIRE_CRON_EXPRESSION}
      - Jobs__RefreshTokenSync__Queue=${AUTH_HANGFIRE_QUEUE}
      - Jobs__RefreshTokenSync__Enabled=${AUTH_HANGFIRE_ENABLED}
      - Jobs__RefreshTokenSync__UserBatchSize=${AUTH_HANGFIRE_USER_BATCH_SIZE}
      - Jobs__RefreshTokenSync__TokenBatchSize=${AUTH_HANGFIRE_TOKEN_BATCH_SIZE}
      # Inbox/Outbox cleanup
      - Jobs__OutboxCleanup__JobId=${AUTH_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${AUTH_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${AUTH_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${AUTH_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${AUTH_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${AUTH_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${AUTH_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${AUTH_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${AUTH_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${AUTH_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${AUTH_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${AUTH_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${AUTH_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${AUTH_INBOX_CLEANUP_MAX_BATCHES}
      # gRPC
      - Grpc__UserService__Url=${USER_GRPC_URL}
      # Kafka
      - Kafka__BootstrapServers=${AUTH_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-api:
    container_name: ${USER_CONTAINER_NAME}
    ports:
      - "${USER_PUBLIC_HTTP_PORT}:${USER_HTTP_PORT}"
      - "${USER_GRPC_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${USER_URLS}
      - ASPNETCORE_HTTP_PORT=${USER_HTTP_PORT}
      - ASPNETCORE_GRPC_PORT=${USER_GRPC_PORT}
      # Database
      - ConnectionStrings__DefaultConnection=${USER_DB_CONNECTION}
      - ConnectionStrings__Hangfire=${USER_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      - Logging__Elasticsearch__Url=${ELASTICSEARCH_URL}
      # Observability (APM/tracing - see docs/setup/observability.md)
      - Observability__ApmServerUrl=${APM_SERVER_URL}
      # JWT
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Cache (Redis) - shared instance with Auth; role cache keys are read
      # under the "auth:roles:" namespace regardless of KeyPrefix here.
      - Cache__ConnectionString=${USER_REDIS_CONNECTION_STRING}
      - Cache__DefaultExpirationMinutes=${USER_REDIS_EXPIRATION_MINUTES}
      - Cache__KeyPrefix=${USER_REDIS_KEY_PREFIX}
      - Cache__ConnectionTimeout=${USER_REDIS_CONNECTION_TIMEOUT}
      # Idempotency (shared framework config - see docs/reference/idempotency.md)
      - Idempotency__HeaderName=${IDEMPOTENCY_HEADER_NAME}
      - Idempotency__LockTimeoutSeconds=${IDEMPOTENCY_LOCK_TIMEOUT_SECONDS}
      - Idempotency__LockExpirationSeconds=${IDEMPOTENCY_LOCK_EXPIRATION_SECONDS}
      - Idempotency__RecordExpirationMinutes=${IDEMPOTENCY_RECORD_EXPIRATION_MINUTES}
      - Idempotency__MaxCachedResponseSizeBytes=${IDEMPOTENCY_MAX_CACHED_RESPONSE_SIZE_BYTES}
      # Inbox/Outbox cleanup
      - Jobs__OutboxCleanup__JobId=${USER_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${USER_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${USER_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${USER_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${USER_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${USER_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${USER_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${USER_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${USER_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${USER_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${USER_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${USER_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${USER_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${USER_INBOX_CLEANUP_MAX_BATCHES}
      # gRPC
      - Grpc__AuthService__Url=${AUTH_GRPC_URL}
      # Kafka
      - Kafka__BootstrapServers=${USER_KAFKA_BROKERS}
      # Elasticsearch (Search read model - see docs/reference/search.md)
      - Elasticsearch__Url=${USER_ELASTICSEARCH_URL}
      - Elasticsearch__Username=${ELASTICSEARCH_APP_USERNAME}
      - Elasticsearch__Password=${ELASTICSEARCH_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  product-api:
    container_name: ${PRODUCT_CONTAINER_NAME}
    ports:
      - "${PRODUCT_PUBLIC_HTTP_PORT}:${PRODUCT_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${PRODUCT_URLS}
      - ASPNETCORE_HTTP_PORT=${PRODUCT_HTTP_PORT}
      # Database
      - ConnectionStrings__DefaultConnection=${PRODUCT_DB_CONNECTION}
      - ConnectionStrings__Hangfire=${PRODUCT_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      - Logging__Elasticsearch__Url=${ELASTICSEARCH_URL}
      - Logging__Elasticsearch__Username=${ELASTICSEARCH_APP_USERNAME}
      - Logging__Elasticsearch__Password=${ELASTICSEARCH_PASSWORD}
      # Observability (APM/tracing - see docs/setup/observability.md)
      - Observability__ApmServerUrl=${APM_SERVER_URL}
      # JWT (validation only - tokens are issued by Auth)
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Cache (Redis) - backs the Idempotency framework (see BuildingBlock.Infrastructure/Idempotency)
      - Cache__ConnectionString=${PRODUCT_REDIS_CONNECTION_STRING}
      - Cache__DefaultExpirationMinutes=${PRODUCT_REDIS_EXPIRATION_MINUTES}
      - Cache__KeyPrefix=${PRODUCT_REDIS_KEY_PREFIX}
      - Cache__ConnectionTimeout=${PRODUCT_REDIS_CONNECTION_TIMEOUT}
      # Idempotency (shared framework config - see docs/reference/idempotency.md)
      - Idempotency__HeaderName=${IDEMPOTENCY_HEADER_NAME}
      - Idempotency__LockTimeoutSeconds=${IDEMPOTENCY_LOCK_TIMEOUT_SECONDS}
      - Idempotency__LockExpirationSeconds=${IDEMPOTENCY_LOCK_EXPIRATION_SECONDS}
      - Idempotency__RecordExpirationMinutes=${IDEMPOTENCY_RECORD_EXPIRATION_MINUTES}
      - Idempotency__MaxCachedResponseSizeBytes=${IDEMPOTENCY_MAX_CACHED_RESPONSE_SIZE_BYTES}
      # Outbox/Inbox cleanup (Product now also self-consumes for Search sync - see docs/reference/search.md)
      - Jobs__OutboxCleanup__JobId=${PRODUCT_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${PRODUCT_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${PRODUCT_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${PRODUCT_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${PRODUCT_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${PRODUCT_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${PRODUCT_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${PRODUCT_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${PRODUCT_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${PRODUCT_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${PRODUCT_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${PRODUCT_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${PRODUCT_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${PRODUCT_INBOX_CLEANUP_MAX_BATCHES}
      # Kafka
      - Kafka__BootstrapServers=${PRODUCT_KAFKA_BROKERS}
      # Elasticsearch (Search read model - see docs/reference/search.md)
      - Elasticsearch__Url=${PRODUCT_ELASTICSEARCH_URL}
      - Elasticsearch__Username=${ELASTICSEARCH_APP_USERNAME}
      - Elasticsearch__Password=${ELASTICSEARCH_PASSWORD}
      # gRPC (stock availability lookup for Search Products - see docs/services/inventory-service.md)
      - Grpc__InventoryService__Url=${INVENTORY_GRPC_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  inventory-api:
    container_name: ${INVENTORY_CONTAINER_NAME}
    ports:
      - "${INVENTORY_PUBLIC_HTTP_PORT}:${INVENTORY_HTTP_PORT}"
      - "${INVENTORY_GRPC_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${INVENTORY_URLS}
      - ASPNETCORE_HTTP_PORT=${INVENTORY_HTTP_PORT}
      - ASPNETCORE_GRPC_PORT=${INVENTORY_GRPC_PORT}
      # Database
      - ConnectionStrings__DefaultConnection=${INVENTORY_DB_CONNECTION}
      - ConnectionStrings__Hangfire=${INVENTORY_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      - Logging__Elasticsearch__Url=${ELASTICSEARCH_URL}
      # Observability (APM/tracing - see docs/setup/observability.md)
      - Observability__ApmServerUrl=${APM_SERVER_URL}
      # JWT (validation only - tokens are issued by Auth)
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Outbox/Inbox cleanup (Inventory gained an Outbox table for audit tracking)
      - Jobs__OutboxCleanup__JobId=${INVENTORY_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${INVENTORY_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${INVENTORY_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${INVENTORY_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${INVENTORY_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${INVENTORY_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${INVENTORY_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${INVENTORY_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${INVENTORY_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${INVENTORY_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${INVENTORY_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${INVENTORY_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${INVENTORY_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${INVENTORY_INBOX_CLEANUP_MAX_BATCHES}
      # Kafka
      - Kafka__BootstrapServers=${INVENTORY_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  order-api:
    container_name: ${ORDER_CONTAINER_NAME}
    ports:
      - "${ORDER_PUBLIC_HTTP_PORT}:${ORDER_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ORDER_URLS}
