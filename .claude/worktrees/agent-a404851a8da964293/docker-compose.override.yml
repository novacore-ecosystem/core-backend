  #     start_period: 40s

  audit-api:
    container_name: ${AUDIT_CONTAINER_NAME}
    ports:
      - "${AUDIT_PUBLIC_HTTP_PORT}:${AUDIT_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${AUDIT_URLS}
      - ASPNETCORE_HTTP_PORT=${AUDIT_HTTP_PORT}
      # Database (Mongo - domain data; Hangfire storage is still Postgres, see AUDIT_HANGFIRE_DB_CONNECTION)
      - ConnectionStrings__Mongo=${AUDIT_MONGODB_URL}
      - Mongo__DatabaseName=${AUDIT_MONGO_DATABASE}
      - ConnectionStrings__Hangfire=${AUDIT_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      # JWT (validation only - tokens are issued by Auth)
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Inbox/Outbox cleanup (Audit consumes from every service and has Outbox wired but unused)
      - Jobs__OutboxCleanup__JobId=${AUDIT_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${AUDIT_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${AUDIT_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${AUDIT_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${AUDIT_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${AUDIT_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${AUDIT_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${AUDIT_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${AUDIT_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${AUDIT_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${AUDIT_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${AUDIT_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${AUDIT_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${AUDIT_INBOX_CLEANUP_MAX_BATCHES}
      # Kafka
      - Kafka__BootstrapServers=${AUDIT_KAFKA_BROKERS}
      # gRPC (actor display-name enrichment for GetAuditLog - fail-open, see docs/reference/grpc.md)
      - Grpc__UserService__Url=${USER_GRPC_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-api:
    container_name: ${NOTIFICATION_CONTAINER_NAME}
    ports:
      - "${NOTIFICATION_PUBLIC_HTTP_PORT}:${NOTIFICATION_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${NOTIFICATION_URLS}
      - ASPNETCORE_HTTP_PORT=${NOTIFICATION_HTTP_PORT}
      # Database (Mongo - domain data; Hangfire storage is still Postgres, see NOTIFICATION_HANGFIRE_DB_CONNECTION)
      - ConnectionStrings__Mongo=${NOTIFICATION_MONGODB_URL}
      - Mongo__DatabaseName=${NOTIFICATION_MONGO_DATABASE}
      - ConnectionStrings__Hangfire=${NOTIFICATION_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      - Logging__Elasticsearch__Url=${ELASTICSEARCH_URL}
      # Observability (APM/tracing - see docs/setup/observability.md)
      - Observability__ApmServerUrl=${APM_SERVER_URL}
      # JWT (validation only - tokens are issued by Auth)
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Inbox/Outbox cleanup (skeleton service - Outbox/Inbox wired but unused, see Audit's pattern)
      - Jobs__OutboxCleanup__JobId=${NOTIFICATION_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${NOTIFICATION_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${NOTIFICATION_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${NOTIFICATION_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${NOTIFICATION_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${NOTIFICATION_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${NOTIFICATION_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${NOTIFICATION_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${NOTIFICATION_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${NOTIFICATION_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${NOTIFICATION_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${NOTIFICATION_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${NOTIFICATION_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${NOTIFICATION_INBOX_CLEANUP_MAX_BATCHES}
      # Kafka
      - Kafka__BootstrapServers=${NOTIFICATION_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============= DATABASES =============
  pg:
    container_name: ${PG_CONTAINER_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    container_name: ${MONGO_CONTAINER_NAME}
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= CACHE & MESSAGE QUEUE =============
  redis:
    container_name: ${REDIS_CONTAINER_NAME}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    container_name: ${KAFKA_CONTAINER_NAME}
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_CONTAINER_NAME}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@${KAFKA_CONTAINER_NAME}:${KAFKA_CONTROLLER_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "${KAFKA_CONTAINER_NAME}:${KAFKA_PORT}",
          "--list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= LOGGING & MONITORING =============
  seq:
    container_name: ${SEQ_CONTAINER_NAME}
    ports:
      - "${SEQ_PORT}:80"
    environment:
      ACCEPT_EULA: ${SEQ_ACCEPT_EULA}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  elasticsearch:
    container_name: ${ELASTICSEARCH_CONTAINER_NAME}
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    environment:
      - discovery.type=${ELASTICSEARCH_DISCOVERY_TYPE}
      - xpack.security.enabled=${ELASTICSEARCH_XPACK_SECURITY_ENABLED}
      - xpack.security.http.ssl.enabled=${ELASTICSEARCH_HTTP_SSL_ENABLED}
      # Bootstraps the built-in `elastic` superuser's password on first start (recognized
      # natively by the ES docker image) - ELASTICSEARCH_USERNAME/PASSWORD alone only tell
      # *consumers* (Kibana/Product/APM) what to send, they don't set anything inside ES itself.
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS}
    healthcheck:
      # Must use the elastic superuser here, not kibana_system - kibana_system's real
      # password isn't provisioned until es-init runs, and es-init depends_on this
      # healthcheck passing first (see es-init below).
      test:
        [
          "CMD-SHELL",
          "curl -s -u ${ELASTICSEARCH_APP_USERNAME}:${ELASTICSEARCH_PASSWORD} http://localhost:9200 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  kibana:
    container_name: ${KIBANA_CONTAINER_NAME}
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=${KIBANA_ELASTICSEARCH_HOSTS}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  es-init:
    environment:
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      # Authenticates as elastic (the only user guaranteed valid right after ES boots via
      # ELASTIC_PASSWORD) - also resets kibana_system's real password to this same value,
      # since nothing else provisions it (see init-ilm-templates.sh).
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_APP_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}

  apm-server:
    container_name: ${APM_SERVER_CONTAINER_NAME}
    ports:
      - "${APM_SERVER_PORT}:8200"
    environment:
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_APP_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    healthcheck:
      # apm-server's image has no curl/wget - a bare TCP connect via bash's /dev/tcp
      # is enough to confirm the port is accepting connections.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
