      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Inbox/Outbox cleanup (Order both publishes and consumes - dual shape like User)
      - Jobs__OutboxCleanup__JobId=${ORDER_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${ORDER_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${ORDER_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${ORDER_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${ORDER_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${ORDER_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${ORDER_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${ORDER_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${ORDER_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${ORDER_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${ORDER_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${ORDER_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${ORDER_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${ORDER_INBOX_CLEANUP_MAX_BATCHES}
      # gRPC (CreateOrderSaga's DeductInventoryStep - see docs/workflows/create-order-saga.md)
      - Grpc__InventoryService__Url=${INVENTORY_GRPC_URL}
      # Kafka
      - Kafka__BootstrapServers=${ORDER_KAFKA_BROKERS}
      # Cache (Redis-backed cart - see Order.Infrastructure/Caching/CartService.cs)
      - Cache__ConnectionString=${ORDER_REDIS_CONNECTION_STRING}
      - Cache__DefaultExpirationMinutes=${ORDER_REDIS_EXPIRATION_MINUTES}
      - Cache__KeyPrefix=${ORDER_REDIS_KEY_PREFIX}
      - Cache__ConnectionTimeout=${ORDER_REDIS_CONNECTION_TIMEOUT}
      # Idempotency (shared framework config - see docs/reference/idempotency.md)
      - Idempotency__HeaderName=${IDEMPOTENCY_HEADER_NAME}
      - Idempotency__LockTimeoutSeconds=${IDEMPOTENCY_LOCK_TIMEOUT_SECONDS}
      - Idempotency__LockExpirationSeconds=${IDEMPOTENCY_LOCK_EXPIRATION_SECONDS}
      - Idempotency__RecordExpirationMinutes=${IDEMPOTENCY_RECORD_EXPIRATION_MINUTES}
      - Idempotency__MaxCachedResponseSizeBytes=${IDEMPOTENCY_MAX_CACHED_RESPONSE_SIZE_BYTES}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  payment-api:
    container_name: ${PAYMENT_CONTAINER_NAME}
    ports:
      - "${PAYMENT_PUBLIC_HTTP_PORT}:${PAYMENT_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${PAYMENT_URLS}
      - ASPNETCORE_HTTP_PORT=${PAYMENT_HTTP_PORT}
      # Database
      - ConnectionStrings__DefaultConnection=${PAYMENT_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      - Logging__Elasticsearch__Url=${ELASTICSEARCH_URL}
      # Observability (APM/tracing - see docs/setup/observability.md)
      - Observability__ApmServerUrl=${APM_SERVER_URL}
      # JWT (validation only - tokens are issued by Auth)
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Kafka
      - Kafka__BootstrapServers=${PAYMENT_KAFKA_BROKERS}
      # Cache (required for the Idempotency framework's distributed lock - see BuildingBlock.Infrastructure.Idempotency)
      - Cache__ConnectionString=${PAYMENT_REDIS_CONNECTION_STRING}
      - Cache__DefaultExpirationMinutes=${PAYMENT_REDIS_EXPIRATION_MINUTES}
      - Cache__KeyPrefix=${PAYMENT_REDIS_KEY_PREFIX}
      - Cache__ConnectionTimeout=${PAYMENT_REDIS_CONNECTION_TIMEOUT}
      # Idempotency (shared framework config - see docs/reference/idempotency.md)
      - Idempotency__HeaderName=${IDEMPOTENCY_HEADER_NAME}
      - Idempotency__LockTimeoutSeconds=${IDEMPOTENCY_LOCK_TIMEOUT_SECONDS}
      - Idempotency__LockExpirationSeconds=${IDEMPOTENCY_LOCK_EXPIRATION_SECONDS}
      - Idempotency__RecordExpirationMinutes=${IDEMPOTENCY_RECORD_EXPIRATION_MINUTES}
      - Idempotency__MaxCachedResponseSizeBytes=${IDEMPOTENCY_MAX_CACHED_RESPONSE_SIZE_BYTES}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

