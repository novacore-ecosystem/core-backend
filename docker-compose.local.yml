########################################################################################
# NovaCore LOCAL Docker Compose
#
# Derived from the canonical docker-compose.yml + docker-compose.override.yml: each
# service block below is the SAME merged configuration those two files produce for the
# services kept in this phase (image/build, container_name, environment, volumes,
# networks, ports, healthcheck, depends_on) - nothing has been redesigned or rewritten
# by hand. The only changes relative to the canonical merge are:
#
#   1. Removed services out of scope for this phase: product-api, inventory-api,
#      order-api, payment-api, promotion-api, shipping-api, elasticsearch, es-init,
#      kibana, apm-server.
#   2. Removed the now-dangling environment lines / depends_on entries that pointed at
#      elasticsearch/apm-server (both are non-blocking Serilog/OTel sinks in application
#      code - see docs/setup/observability.md - so omitting them is safe), and the
#      yarp-api-gateway environment lines that pointed at Inventory/Order/Product (those
#      services don't exist locally either).
#
# PostgreSQL/MongoDB/Redis/Kafka/Seq were already single shared containers in the
# canonical compose (see docs/01-architecture-map.md#infrastructure-dependencies) -
# no consolidation was needed for them, they're carried over as-is.
#
# Gateway routing note: yarp-api-gateway's actual route table (which backend URL each
# /api/{service}/ prefix hits) comes entirely from the bind-mounted
# src/ApiGateways/YarpApiGateway/appsettings.json (Gateway:Services:{Key}:Url), not from
# the Auth__Url/User__Url env lines below - GatewayOptions only binds the "Gateway"
# config section, so those flat top-level env vars are inert in the canonical stack too.
# appsettings.json already points Auth/User/Audit/Notification at auth-api:8080,
# user-api:8080, audit-api:8080, notification-api:8080 - the same container/service
# names used in this file, so routing works unmodified.
#
# Run with:
#   docker compose --env-file .env.local -f docker-compose.local.yml up -d
########################################################################################

services:
  # ============= API GATEWAY =============
  yarp-api-gateway:
    build:
      context: .
      dockerfile: ./src/ApiGateways/YarpApiGateway/Dockerfile
    container_name: ${GATEWAY_CONTAINER_NAME}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ./src/ApiGateways/YarpApiGateway/appsettings.json:/app/appsettings.json:ro
    ports:
      - "${GATEWAY_PUBLIC_PORT}:${GATEWAY_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      # Service URLs (inert - see the Gateway routing note above; kept for parity with
      # the canonical override.yml, which never wired Audit/Notification here either)
      - Auth__Url=${AUTH_SERVICE_URL}
      - User__Url=${USER_SERVICE_URL}
      # JWT Configuration (must match Auth's Jwt__* - Auth issues tokens, Gateway only
      # validates their integrity)
      - Gateway__Jwt__SecretKey=${GATEWAY_JWT_SECRET_KEY}
      - Gateway__Jwt__Issuer=${GATEWAY_JWT_ISSUER}
      - Gateway__Jwt__Audience=${GATEWAY_JWT_AUDIENCE}
      # Redis (refresh token existence check only)
      - Gateway__Redis__ConnectionString=${GATEWAY_REDIS_CONNECTION_STRING}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
    healthcheck:
      # Must probe the in-container port (GATEWAY_HTTP_PORT/8080), not GATEWAY_PUBLIC_PORT (5000)
      # - that's only the host-side mapping, and curl runs *inside* this container.
      test:
        ["CMD", "curl", "-f", "http://localhost:${GATEWAY_HTTP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============= MICROSERVICES =============
  auth-api:
    image: ${AUTH_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ./src/Services/Auth/Auth.API/Dockerfile
    container_name: ${AUTH_CONTAINER_NAME}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      seq:
        condition: service_healthy
    networks:
      - default
    ports:
      - "${AUTH_PUBLIC_HTTP_PORT}:${AUTH_HTTP_PORT}"
      - "${AUTH_GRPC_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${AUTH_URLS}
      - ASPNETCORE_HTTP_PORT=${AUTH_HTTP_PORT}
      - ASPNETCORE_GRPC_PORT=${AUTH_GRPC_PORT}
      # Database
      - ConnectionStrings__DefaultConnection=${AUTH_DB_CONNECTION}
      - ConnectionStrings__Hangfire=${HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      # Cache (Redis)
      - Cache__ConnectionString=${AUTH_REDIS_CONNECTION_STRING}
      - Cache__DefaultExpirationMinutes=${AUTH_REDIS_EXPIRATION_MINUTES}
      - Cache__KeyPrefix=${AUTH_REDIS_KEY_PREFIX}
      - Cache__ConnectionTimeout=${AUTH_REDIS_CONNECTION_TIMEOUT}
      # JWT
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Hangfire
      - Jobs__RefreshTokenSync__JobId=${AUTH_HANGFIRE_JOB_ID}
      - Jobs__RefreshTokenSync__CronExpression=${AUTH_HANGFIRE_CRON_EXPRESSION}
      - Jobs__RefreshTokenSync__Queue=${AUTH_HANGFIRE_QUEUE}
      - Jobs__RefreshTokenSync__Enabled=${AUTH_HANGFIRE_ENABLED}
      - Jobs__RefreshTokenSync__UserBatchSize=${AUTH_HANGFIRE_USER_BATCH_SIZE}
      - Jobs__RefreshTokenSync__TokenBatchSize=${AUTH_HANGFIRE_TOKEN_BATCH_SIZE}
      # Inbox/Outbox cleanup
      - Jobs__OutboxCleanup__JobId=${AUTH_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${AUTH_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${AUTH_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${AUTH_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${AUTH_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${AUTH_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${AUTH_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${AUTH_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${AUTH_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${AUTH_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${AUTH_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${AUTH_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${AUTH_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${AUTH_INBOX_CLEANUP_MAX_BATCHES}
      # gRPC
      - Grpc__UserService__Url=${USER_GRPC_URL}
      # Kafka
      - Kafka__BootstrapServers=${AUTH_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-api:
    image: ${USER_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ./src/Services/User/User.API/Dockerfile
    container_name: ${USER_CONTAINER_NAME}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      seq:
        condition: service_healthy
    networks:
      - default
    ports:
      - "${USER_PUBLIC_HTTP_PORT}:${USER_HTTP_PORT}"
      - "${USER_GRPC_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${USER_URLS}
      - ASPNETCORE_HTTP_PORT=${USER_HTTP_PORT}
      - ASPNETCORE_GRPC_PORT=${USER_GRPC_PORT}
      # Database
      - ConnectionStrings__DefaultConnection=${USER_DB_CONNECTION}
      - ConnectionStrings__Hangfire=${USER_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      # JWT
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Cache (Redis) - shared instance with Auth; role cache keys are read
      # under the "auth:roles:" namespace regardless of KeyPrefix here.
      - Cache__ConnectionString=${USER_REDIS_CONNECTION_STRING}
      - Cache__DefaultExpirationMinutes=${USER_REDIS_EXPIRATION_MINUTES}
      - Cache__KeyPrefix=${USER_REDIS_KEY_PREFIX}
      - Cache__ConnectionTimeout=${USER_REDIS_CONNECTION_TIMEOUT}
      # Idempotency (shared framework config - see docs/reference/idempotency.md)
      - Idempotency__HeaderName=${IDEMPOTENCY_HEADER_NAME}
      - Idempotency__LockTimeoutSeconds=${IDEMPOTENCY_LOCK_TIMEOUT_SECONDS}
      - Idempotency__LockExpirationSeconds=${IDEMPOTENCY_LOCK_EXPIRATION_SECONDS}
      - Idempotency__RecordExpirationMinutes=${IDEMPOTENCY_RECORD_EXPIRATION_MINUTES}
      - Idempotency__MaxCachedResponseSizeBytes=${IDEMPOTENCY_MAX_CACHED_RESPONSE_SIZE_BYTES}
      # Inbox/Outbox cleanup
      - Jobs__OutboxCleanup__JobId=${USER_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${USER_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${USER_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${USER_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${USER_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${USER_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${USER_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${USER_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${USER_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${USER_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${USER_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${USER_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${USER_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${USER_INBOX_CLEANUP_MAX_BATCHES}
      # gRPC
      - Grpc__AuthService__Url=${AUTH_GRPC_URL}
      # Kafka
      - Kafka__BootstrapServers=${USER_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  audit-api:
    image: ${AUDIT_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ./src/Services/Audit/Audit.API/Dockerfile
    container_name: ${AUDIT_CONTAINER_NAME}
    depends_on:
      mongo:
        condition: service_healthy
      pg:
        condition: service_healthy
      kafka:
        condition: service_started
      seq:
        condition: service_healthy
    networks:
      - default
    ports:
      - "${AUDIT_PUBLIC_HTTP_PORT}:${AUDIT_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${AUDIT_URLS}
      - ASPNETCORE_HTTP_PORT=${AUDIT_HTTP_PORT}
      # Database (Mongo - domain data; Hangfire storage is still Postgres, see AUDIT_HANGFIRE_DB_CONNECTION)
      - ConnectionStrings__Mongo=${AUDIT_MONGODB_URL}
      - Mongo__DatabaseName=${AUDIT_MONGO_DATABASE}
      - ConnectionStrings__Hangfire=${AUDIT_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      # JWT (validation only - tokens are issued by Auth)
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Inbox/Outbox cleanup (Audit consumes from every service and has Outbox wired but unused)
      - Jobs__OutboxCleanup__JobId=${AUDIT_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${AUDIT_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${AUDIT_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${AUDIT_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${AUDIT_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${AUDIT_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${AUDIT_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${AUDIT_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${AUDIT_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${AUDIT_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${AUDIT_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${AUDIT_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${AUDIT_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${AUDIT_INBOX_CLEANUP_MAX_BATCHES}
      # Kafka
      - Kafka__BootstrapServers=${AUDIT_KAFKA_BROKERS}
      # gRPC (actor display-name enrichment for GetAuditLog - fail-open, see docs/reference/grpc.md)
      - Grpc__UserService__Url=${USER_GRPC_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-api:
    image: ${NOTIFICATION_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ./src/Services/Notification/Notification.API/Dockerfile
    container_name: ${NOTIFICATION_CONTAINER_NAME}
    depends_on:
      mongo:
        condition: service_healthy
      pg:
        condition: service_healthy
      kafka:
        condition: service_started
      seq:
        condition: service_healthy
    networks:
      - default
    ports:
      - "${NOTIFICATION_PUBLIC_HTTP_PORT}:${NOTIFICATION_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${NOTIFICATION_URLS}
      - ASPNETCORE_HTTP_PORT=${NOTIFICATION_HTTP_PORT}
      # Database (Mongo - domain data; Hangfire storage is still Postgres, see NOTIFICATION_HANGFIRE_DB_CONNECTION)
      - ConnectionStrings__Mongo=${NOTIFICATION_MONGODB_URL}
      - Mongo__DatabaseName=${NOTIFICATION_MONGO_DATABASE}
      - ConnectionStrings__Hangfire=${NOTIFICATION_HANGFIRE_DB_CONNECTION}
      # Logging
      - Logging__Seq__Url=${SEQ_URL}
      # JWT (validation only - tokens are issued by Auth)
      - Jwt__SecretKey=${AUTH_JWT_SECRET_KEY}
      - Jwt__Issuer=${AUTH_JWT_ISSUER}
      - Jwt__Audience=${AUTH_JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      # Inbox/Outbox cleanup (skeleton service - Outbox/Inbox wired but unused, see Audit's pattern)
      - Jobs__OutboxCleanup__JobId=${NOTIFICATION_OUTBOX_CLEANUP_JOB_ID}
      - Jobs__OutboxCleanup__CronExpression=${NOTIFICATION_OUTBOX_CLEANUP_CRON}
      - Jobs__OutboxCleanup__Queue=${NOTIFICATION_OUTBOX_CLEANUP_QUEUE}
      - Jobs__OutboxCleanup__Enabled=${NOTIFICATION_OUTBOX_CLEANUP_ENABLED}
      - Jobs__OutboxCleanup__RetentionPeriod=${NOTIFICATION_OUTBOX_CLEANUP_RETENTION}
      - Jobs__OutboxCleanup__BatchSize=${NOTIFICATION_OUTBOX_CLEANUP_BATCH_SIZE}
      - Jobs__OutboxCleanup__MaxBatchesPerRun=${NOTIFICATION_OUTBOX_CLEANUP_MAX_BATCHES}
      - Jobs__InboxCleanup__JobId=${NOTIFICATION_INBOX_CLEANUP_JOB_ID}
      - Jobs__InboxCleanup__CronExpression=${NOTIFICATION_INBOX_CLEANUP_CRON}
      - Jobs__InboxCleanup__Queue=${NOTIFICATION_INBOX_CLEANUP_QUEUE}
      - Jobs__InboxCleanup__Enabled=${NOTIFICATION_INBOX_CLEANUP_ENABLED}
      - Jobs__InboxCleanup__RetentionPeriod=${NOTIFICATION_INBOX_CLEANUP_RETENTION}
      - Jobs__InboxCleanup__BatchSize=${NOTIFICATION_INBOX_CLEANUP_BATCH_SIZE}
      - Jobs__InboxCleanup__MaxBatchesPerRun=${NOTIFICATION_INBOX_CLEANUP_MAX_BATCHES}
      # Kafka
      - Kafka__BootstrapServers=${NOTIFICATION_KAFKA_BROKERS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============= DATABASES =============
  pg:
    image: ${POSTGRES_IMAGE}
    container_name: ${PG_CONTAINER_NAME}
    # Default max_connections=100 is exhausted once every service (each with its own EF Core
    # pool + a separate Hangfire.PostgreSql storage pool) connects to this single shared instance -
    # confirmed via "sorry, too many clients already" once Auth/User/Product/Inventory/Order/Audit
    # were all running together instead of just the original Order-only vertical slice.
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: ${MONGO_IMAGE}
    container_name: ${MONGO_CONTAINER_NAME}
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - default
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= CACHE & MESSAGE QUEUE =============
  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: ${KAFKA_CONTAINER_NAME}
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_CONTAINER_NAME}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@${KAFKA_CONTAINER_NAME}:${KAFKA_CONTROLLER_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "${KAFKA_CONTAINER_NAME}:${KAFKA_PORT}",
          "--list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= LOGGING & MONITORING =============
  seq:
    image: ${SEQ_IMAGE}
    container_name: ${SEQ_CONTAINER_NAME}
    ports:
      - "${SEQ_PORT}:80"
    environment:
      ACCEPT_EULA: ${SEQ_ACCEPT_EULA}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD}
    volumes:
      - seq_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
    name: ${COMPOSE_NETWORK}
    external: true

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  seq_data:
