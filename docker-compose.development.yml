x-vault-volume: &vault-volume
  - ./scripts/vault/fetch-and-run.sh:/vault/fetch-and-run.sh:ro

x-dotnet-defaults: &dotnet-defaults
  entrypoint: ["/bin/sh", "/vault/fetch-and-run.sh"]
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 384M

services:
  # ============= API GATEWAY =============
  yarp-api-gateway:
    <<: *dotnet-defaults
    build:
      context: .
      dockerfile: ./src/ApiGateways/YarpApiGateway/Dockerfile
    container_name: ${GATEWAY_CONTAINER_NAME}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ./src/ApiGateways/YarpApiGateway/appsettings.json:/app/appsettings.json:ro
      - ./scripts/vault/fetch-and-run.sh:/vault/fetch-and-run.sh:ro
    ports:
      - "${GATEWAY_PUBLIC_PORT}:${GATEWAY_HTTP_PORT}"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - VAULT_PATHS=nova-core/dev/security,nova-core/dev/infra-redis,nova-core/dev/services/gateway
    command: ["dotnet", "NovaCore.YarpApiGateway.dll"]
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${GATEWAY_HTTP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

